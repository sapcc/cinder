<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="t d">
  <title id="t">Why a per-method guard cannot work</title>
  <desc id="d">46 methods carried reject_if_draining. 11 were called from inside another manager method, 14 were call entry points, and 21 were cast entry points where refusing destroyed the request. No group could be guarded safely, so the guard was removed.</desc>

  <defs>
    <marker id="arrow" width="10" height="10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3ad"/>
    </marker>
  </defs>

  <rect width="1000" height="790" fill="#ffffff"/>

  <text x="40" y="36" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2328">Why a per-method guard cannot work</text>
  <text x="40" y="60" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#5b6470">46 methods carried <tspan font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">@reject_if_draining</tspan>. Two questions sorted them into three groups.</text>

  <!-- start -->
  <rect x="290" y="76" width="420" height="52" rx="6" fill="#f5f6f8" stroke="#ccd2d9" stroke-width="1.5"/>
  <text x="500" y="108" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328">46 decorated methods in cinder/volume/manager.py</text>

  <line x1="500" y1="128" x2="500" y2="160" stroke="#9aa3ad" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Q1 -->
  <rect x="270" y="164" width="460" height="64" rx="8" fill="#eef3f8" stroke="#9db4c9" stroke-width="1.5"/>
  <text x="500" y="191" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328">1. Is it ever called by another manager method?</text>
  <text x="500" y="211" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6470">not by a message from outside &#8212; by the manager itself</text>

  <path d="M 500 228 L 500 250 L 190 250 L 190 394" fill="none" stroke="#9aa3ad" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 500 228 L 500 250 L 655 250 L 655 274" fill="none" stroke="#9aa3ad" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="243" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#a93226">YES &#8212; 11 methods</text>
  <text x="575" y="243" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1e7a45">NO &#8212; 35 methods</text>

  <!-- Q2 -->
  <rect x="480" y="276" width="350" height="64" rx="8" fill="#eef3f8" stroke="#9db4c9" stroke-width="1.5"/>
  <text x="655" y="303" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#1f2328">2. Does the caller block</text>
  <text x="655" y="323" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#1f2328">waiting for a reply?</text>

  <path d="M 655 340 L 655 364 L 500 364 L 500 394" fill="none" stroke="#9aa3ad" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 655 340 L 655 364 L 810 364 L 810 394" fill="none" stroke="#9aa3ad" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="575" y="357" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#5b6470">call</text>
  <text x="735" y="357" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#5b6470">cast</text>

  <!-- CARD A -->
  <rect x="40" y="398" width="300" height="248" rx="8" fill="#fdf0ee" stroke="#e0a49c" stroke-width="1.5"/>
  <text x="60" y="424" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#a93226">DROP</text>
  <text x="60" y="446" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6470">11 of 46 methods</text>
  <text x="60" y="474" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">Fires on a call made from</text>
  <text x="60" y="492" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">inside an operation that is</text>
  <text x="60" y="510" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">already running.</text>
  <text x="60" y="542" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">delete_snapshot</text>
  <text x="60" y="560" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">create_snapshot</text>
  <text x="60" y="578" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">detach_volume</text>
  <text x="60" y="596" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">finish_failover</text>
  <text x="60" y="622" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6470">4 of 11 shown</text>

  <!-- CARD B -->
  <rect x="350" y="398" width="300" height="248" rx="8" fill="#edf9f1" stroke="#a6d8ba" stroke-width="1.5"/>
  <text x="370" y="424" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1e7a45">KEEP</text>
  <text x="370" y="446" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6470">14 of 46 methods</text>
  <text x="370" y="474" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">The caller is blocked. An</text>
  <text x="370" y="492" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">immediate error beats waiting</text>
  <text x="370" y="510" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">for the pod to die.</text>
  <text x="370" y="542" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">attach_volume</text>
  <text x="370" y="560" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">accept_transfer</text>
  <text x="370" y="578" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">attachment_update</text>
  <text x="370" y="596" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">get_capabilities</text>
  <text x="370" y="622" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6470">4 of 14 shown</text>

  <!-- CARD C -->
  <rect x="660" y="398" width="300" height="248" rx="8" fill="#fff8e6" stroke="#e6c46a" stroke-width="1.5"/>
  <text x="680" y="424" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#8a5a00">DECIDE</text>
  <text x="680" y="446" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6470">21 of 46 methods</text>
  <text x="680" y="474" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">Nobody is waiting, and the</text>
  <text x="680" y="492" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">request is already acked.</text>
  <text x="680" y="510" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">Refusing it destroys it.</text>
  <text x="680" y="542" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">extend_volume</text>
  <text x="680" y="560" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">retype</text>
  <text x="680" y="578" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">create_group</text>
  <text x="680" y="596" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1f2328">reimage</text>
  <text x="680" y="622" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6470">4 of 21 shown</text>

  <!-- footer -->
  <rect x="40" y="666" width="920" height="100" rx="8" fill="#fbfbfc" stroke="#dfe3e8" stroke-width="1.5"/>
  <text x="70" y="694" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">10 of the 11 DROP methods are also RPC entry points &#8212; only finish_failover is not. So dropping the decorator would also remove it from real entry points.</text>
  <text x="70" y="716" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2328">No decorator on the method can serve both roles: it cannot tell an arriving request from a call the manager makes to itself.</text>
  <text x="70" y="738" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2328">None of the three groups can be guarded safely, so the guard was removed and phase 1 stops all new work.</text>
  <text x="70" y="756" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#5b6470">Counts from cinder/volume/manager.py on this branch; call/cast classification from cinder/volume/rpcapi.py.</text>
</svg>
